<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">W1 của Hiệp: từ một cuộc gọi giả lập đến dữ liệu kiểm chứng</title>
  <desc id="desc">Sơ đồ gồm cấu hình thế giới và network truth ẩn, luồng cuộc gọi qua BE, Selector, client và TURN, dữ liệu raw synthetic, kiểm tra tính nhất quán và đầu ra demo W1. Contract sẵn sàng cho simulator; nguồn thu production chưa xác minh.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Segoe UI","Noto Sans",Arial,sans-serif;fill:#172033}
      .title{font-size:31px;font-weight:750}
      .subtitle{font-size:16px;fill:#475569}
      .tag{font-size:13px;font-weight:700;letter-spacing:.07em}
      .head{font-size:20px;font-weight:700}
      .body{font-size:16px}
      .small{font-size:14px;fill:#475569}
      .mono{font-family:Consolas,"Courier New",monospace;font-size:14px}
      .card{fill:#fff;stroke:#d8e2ef;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="840" fill="#f6f9fc"/>
  <rect x="0" y="0" width="1440" height="12" fill="#0f766e"/>
  <text class="title" x="50" y="62">W1 · Hiệp dựng simulator có thể kiểm chứng</text>
  <text class="subtitle" x="50" y="93">04–10/11/2026 · Một cuộc gọi synthetic đi từ giả định đến trace rõ nguồn và kết quả</text>

  <rect x="50" y="122" width="350" height="312" rx="20" class="card"/>
  <rect x="50" y="122" width="350" height="9" rx="4" fill="#0f766e"/>
  <text class="tag" x="76" y="165" style="fill:#0f766e">① ĐẦU VÀO · HIỆP</text>
  <text class="head" x="76" y="202">Thế giới giả lập</text>
  <text class="body" x="76" y="237">User: country, miền, ISP, mạng</text>
  <text class="body" x="76" y="267">TURN: vị trí, ISP, trạng thái</text>
  <text class="body" x="76" y="297">Traffic, sự cố và seed cố định</text>
  <rect x="75" y="324" width="300" height="83" rx="12" fill="#e8f5f2"/>
  <text class="body" x="92" y="350" font-weight="700">Network truth ẩn</text>
  <text class="small" x="92" y="374">Chỉ simulator biết chất lượng thật.</text>
  <text class="small" x="92" y="394">Policy và dashboard không đọc.</text>

  <path class="line" d="M405 278 H431"/>

  <rect x="438" y="122" width="560" height="312" rx="20" class="card"/>
  <rect x="438" y="122" width="560" height="9" rx="4" fill="#4f46e5"/>
  <text class="tag" x="464" y="165" style="fill:#4f46e5">② LUỒNG MỘT CUỘC GỌI</text>
  <text class="head" x="464" y="202">Sự kiện nối tiếp theo call_id</text>
  <text class="body" x="464" y="237">A gọi → BE tạo call_session</text>
  <text class="body" x="464" y="270">BE hỏi Selector → Decision Log tạm</text>
  <text class="body" x="464" y="303">Client áp dụng cấu hình → ICE chọn cặp thật</text>
  <text class="body" x="464" y="336">Hai client báo chất lượng → BE báo kết thúc</text>
  <line x1="464" x2="971" y1="360" y2="360" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="small" x="464" y="386">Signaling đi qua BE; media đi A → TURN(A) → TURN(B) → B.</text>
  <text class="small" x="464" y="411">Đoàn cung cấp policy/ranking; interface còn chờ contract chốt.</text>

  <path class="line" d="M1003 278 H1029"/>

  <rect x="1036" y="122" width="354" height="312" rx="20" class="card"/>
  <rect x="1036" y="122" width="354" height="9" rx="4" fill="#0f766e"/>
  <text class="tag" x="1062" y="165" style="fill:#0f766e">③ RAW SYNTHETIC</text>
  <text class="head" x="1062" y="202">Bằng chứng quan sát</text>
  <text class="mono" x="1062" y="239">selector_decision</text>
  <text class="mono" x="1062" y="268">client_applied_config</text>
  <text class="mono" x="1062" y="297">ice_event · call_stats_epoch</text>
  <text class="mono" x="1062" y="326">call_outcome · client_call_report</text>
  <line x1="1062" x2="1364" y1="351" y2="351" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="small" x="1062" y="380">Gắn data_source = synthetic.</text>
  <text class="small" x="1062" y="402">Không chép truth thành phép đo.</text>

  <path class="line" d="M1213 442 V475 H724 V489"/>
  <text class="tag" x="50" y="509" style="fill:#0f766e">④ HIỆP KIỂM TRA VÀ DEMO</text>

  <rect x="50" y="532" width="419" height="147" rx="17" class="card"/>
  <circle cx="81" cy="565" r="13" fill="#0f766e"/>
  <text x="76" y="571" font-size="16" font-weight="700" style="fill:#fff">1</text>
  <text class="head" x="109" y="572">Tái lập được</text>
  <text class="body" x="76" y="606">Cùng cấu hình + seed → cùng event.</text>
  <text class="small" x="76" y="640">Thay sự cố → outcome đổi có lý do.</text>

  <rect x="486" y="532" width="419" height="147" rx="17" class="card"/>
  <circle cx="517" cy="565" r="13" fill="#0f766e"/>
  <text x="512" y="571" font-size="16" font-weight="700" style="fill:#fff">2</text>
  <text class="head" x="545" y="572">Trace một call_id</text>
  <text class="body" x="512" y="606">Đề xuất → áp dụng → ICE → kết quả.</text>
  <text class="small" x="512" y="640">ID, thời gian và trạng thái khớp nhau.</text>

  <rect x="922" y="532" width="468" height="147" rx="17" class="card"/>
  <circle cx="953" cy="565" r="13" fill="#0f766e"/>
  <text x="948" y="571" font-size="16" font-weight="700" style="fill:#fff">3</text>
  <text class="head" x="981" y="572">Báo cáo W1</text>
  <text class="body" x="948" y="606">Ca bình thường, lỗi TURN, giả định.</text>
  <text class="small" x="948" y="640">Nêu rõ câu hỏi chờ Đoàn/mentor.</text>

  <rect x="50" y="713" width="1340" height="83" rx="15" fill="#fff2e8" stroke="#f5c49d" stroke-width="1.5"/>
  <text class="tag" x="77" y="745" style="fill:#b45309">CHƯA CHỐT · DATA CONTRACT V0.5.0 LÀ ĐỀ XUẤT</text>
  <text class="body" x="77" y="776">Sim dùng 8 mục cấu hình · Mentor xác nhận? · Biết Callee khi nào? · Client gửi gì? · TURN log nối sao?</text>
</svg>
