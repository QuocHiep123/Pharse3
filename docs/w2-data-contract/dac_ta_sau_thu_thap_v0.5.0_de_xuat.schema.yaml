      end_reason_rule_version: {type: [string, 'null'], description: 'Quy tắc phân loại end_reason từ end_signal, client_end_reason và sự kiện ICE', x-change: new}
    required: [call_id, outcome_version, outcome_status, outcome_provenance, ice_connected, dtls_connected, media_connected, end_reason]
    unevaluatedProperties: false
