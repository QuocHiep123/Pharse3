  # ---------- Object dùng chung ----------
  event_envelope:
    title: Cột chung của mọi bảng event thô (§1.1)
    type: object
    properties:
      event_id: {type: string, format: uuid, description: 'Duy nhất, dùng dedup'}
      contract_version: {type: string}
      data_source: {$ref: '#/$defs/e_data_source'}
      producer: {$ref: '#/$defs/e_producer'}
      event_ts: {type: string, format: date-time, description: Theo đồng hồ producer; pipeline không ghi đè}
      ingest_ts: {type: string, format: date-time, description: Lúc collector nhận}
      sim_run_id: {type: [string, 'null'], description: Bắt buộc khi data_source = synthetic}
      dt: {type: string, format: date, description: Ngày UTC của event_ts}
    required: [event_id, contract_version, data_source, producer, event_ts, ingest_ts, dt]
    allOf:
      - {if: {required: [data_source], properties: {data_source: {const: synthetic}}}, then: {required: [sim_run_id], properties: {sim_run_id: {not: {type: 'null'}}}}}
  derived_meta:
    title: Cột chung của bảng do pipeline dựng
    type: object
    properties:
      contract_version: {type: string}
      data_source: {$ref: '#/$defs/e_data_source'}
      sim_run_id: {type: [string, 'null']}
      pipeline_run_id: {type: string}
      dt: {type: string, format: date}
    required: [contract_version, data_source, pipeline_run_id, dt]
  ctx:
    title: Bối cảnh một bên lúc quyết định (§4). Field chưa biết ghi unknown
    type: object
    properties:
      user_hash: {type: [string, 'null']}
      country: {type: string}
      vn_region: {anyOf: [{$ref: '#/$defs/e_vn_region'}, {type: 'null'}]}
      city: {type: string}
      isp: {type: string}
      asn: {type: [integer, 'null']}
      network_type: {$ref: '#/$defs/e_network_type'}
      geo_source: {$ref: '#/$defs/e_geo_source'}
      geo_mismatch: {type: [boolean, 'null']}
      device_id: {type: string}
      platform: {$ref: '#/$defs/e_platform'}
      os_version: {type: [string, 'null']}
      app_version: {type: [string, 'null']}
      sdk_version: {type: [string, 'null']}
      device_model: {type: [string, 'null']}
      browser_name: {type: [string, 'null']}
      browser_version: {type: [string, 'null']}
    required: [country, city, isp, network_type, geo_source, device_id, platform]
    additionalProperties: false
    x-moved-columns: [{column: segment_key, to: Feature Engineering}]
  list_entry:
    title: 'Một mục trong danh sách đã cấp: một URL trên một server với một giao thức'
    type: object
    properties:
      entry_id: {type: string, description: Khóa trong một danh sách, x-change: new}
      rank: {type: integer, minimum: 1, description: 'Vị trí trong danh sách, liên tục từ 1'}
      turn_id: {type: [string, 'null'], description: Có thể null nếu mục là endpoint hoặc pool chưa gắn máy, x-change: changed}
      config_ref: {type: [string, 'null'], description: URL hoặc tham chiếu cấu hình, x-change: new}
      normalized_config_key: {type: string, description: Định nghĩa duplicate trong một danh sách, x-change: new, x-review: S4}
      client_turn_transport: {$ref: '#/$defs/e_transport', description: Selector muốn dùng giao thức nào tới TURN, x-change: new}
      roles: {type: array, items: {$ref: '#/$defs/e_list_role'}, x-change: new}
      score: {type: [number, 'null'], description: Chỉ so trong một decision}
      score_components: {type: [object, 'null'], description: Gồm backoff_level; hạ ưu tiên do tải ghi tại đây theo quy ước}
      reason_codes: {type: [array, 'null'], items: {type: string}}
    required: [entry_id, rank, normalized_config_key, client_turn_transport, roles]
    additionalProperties: false
  filtered_turn:
    title: TURN bị lọc
    type: object
    properties:
      turn_id: {type: string}
      reason: {$ref: '#/$defs/e_filter_reason'}
    required: [turn_id, reason]
    additionalProperties: false
  excluded_turn:
    title: TURN client yêu cầu loại
    type: object
    properties:
      turn_id: {type: string}
      reason: {type: [string, 'null'], x-change: additive}
    required: [turn_id]
    additionalProperties: false
  confidence_evidence:
    title: Căn cứ của mức tin cậy
    type: object
    properties:
      segment_level: {anyOf: [{$ref: '#/$defs/e_segment_level'}, {type: 'null'}]}
      n_calls: {type: [integer, 'null'], minimum: 0}
      note: {type: [string, 'null']}
    required: []
    additionalProperties: false
  eligible_action_set:
    title: Tham chiếu tới tập hành động đủ điều kiện
    type: object
    properties:
      ref: {type: string, description: 'Object hoặc snapshot bất biến, định vị được'}
      content_hash: {type: [string, 'null'], description: 'Chỉ để kiểm tra nội dung, không tự dựng lại hành động'}
    required: [ref]
    additionalProperties: false
  list_lead_pair:
    title: Cặp dẫn đầu
    type: object
    properties:
      turn_caller: {type: string}
      turn_callee: {type: string}
      transport_caller: {anyOf: [{$ref: '#/$defs/e_transport'}, {type: 'null'}]}
      transport_callee: {anyOf: [{$ref: '#/$defs/e_transport'}, {type: 'null'}]}
    required: [turn_caller, turn_callee]
    additionalProperties: false
  side_list:
    title: Danh sách cho một bên trong SelectResponse
    type: object
    properties:
      entries: {type: array, items: {$ref: '#/$defs/list_entry'}}
      filtered_out: {type: array, items: {$ref: '#/$defs/filtered_turn'}}
      returned_list_size: {type: integer, minimum: 0}
      is_exploration: {type: boolean}
    required: [entries, filtered_out, returned_list_size, is_exploration]
    additionalProperties: false
  pair_prediction:
    title: Một cặp được cân nhắc trong SelectResponse; BE chép vào selector_decision_pair
    type: object
    properties:
      turn_caller: {type: string}
      turn_callee: {type: string}
      transport_caller: {$ref: '#/$defs/e_transport'}
      transport_callee: {$ref: '#/$defs/e_transport'}
      metric: {type: string}
      unit: {type: string}
      est_value: {type: [number, 'null']}
      interval_low: {type: [number, 'null']}
      interval_high: {type: [number, 'null']}
      interval_kind: {anyOf: [{$ref: '#/$defs/e_interval_kind'}, {type: 'null'}]}
      interval_level: {type: [number, 'null'], minimum: 0, maximum: 1}
      in_topk: {type: boolean}
      is_lead: {type: boolean}
      estimate_source: {type: [string, 'null']}
      estimator_version: {type: [string, 'null']}
      input_snapshot_id: {type: [string, 'null'], description: Cutoff hoặc snapshot nguồn}
      gate_status: {$ref: '#/$defs/e_gate_status'}
      gate_reason: {type: [string, 'null']}
      gate_rule_version: {type: [string, 'null'], description: Cần nếu policy_version không tham chiếu bất biến tới quy tắc}
    required: [turn_caller, turn_callee, transport_caller, transport_callee, metric, unit, in_topk, is_lead, gate_status]
    additionalProperties: false

  # ---------- Pipeline làm sạch ----------
  outcome_log:
    title: 'Outcome Log: view sau pipeline'
    x-kind: derived
    x-grain: Một phiên bản outcome của một cuộc gọi; view hiện hành có một dòng
    x-contract-ref: §5.9
    x-primary-key: [call_id, outcome_version]
    x-foreign-keys: [{columns: [call_id], references: call_session}]
    x-producer: 'pipeline, từ call_outcome, client_call_report, ice_event, call_stats_epoch'
    x-change: new
    x-review: S8
    x-notes: [Phân tích bắt đầu từ call_session rồi left join; không có dòng outcome thì cuộc gọi vẫn ở trong cohort, Placeholder không tự điền false, 'Cặp được chọn lấy từ ice_attempt, tóm tắt chất lượng từ call_stats_epoch, nối theo call_id']
    type: object
    allOf:
      - {$ref: '#/$defs/derived_meta'}
      - {if: {required: [answered], properties: {answered: {const: false}}}, then: {required: [end_reason], properties: {end_reason: {enum: [invite_undelivered, not_answered, rejected, cancelled_by_caller, unknown]}}}}
      - {if: {required: [end_reason], properties: {end_reason: {const: ice_failed}}}, then: {required: [answered, ice_connected], properties: {answered: {const: true}, ice_connected: {const: 'false'}}}}
      - {if: {required: [end_reason], properties: {end_reason: {const: media_setup_failed}}}, then: {required: [answered, ice_connected, media_connected], properties: {answered: {const: true}, ice_connected: {const: 'true'}, media_connected: {const: 'false'}}}}
      - {if: {required: [answered, media_connected], properties: {answered: {const: true}, media_connected: {const: 'false'}}}, then: {required: [end_reason], properties: {end_reason: {enum: [ice_failed, media_setup_failed, normal_hangup, app_crash, unknown]}}}}
      - {if: {required: [end_reason], properties: {end_reason: {enum: [dropped_network, dropped_turn]}}}, then: {required: [dropped], properties: {dropped: {const: true}}}}
      - {if: {required: [dropped], properties: {dropped: {const: true}}}, then: {allOf: [{required: [answered, end_reason], properties: {answered: {const: true}, end_reason: {enum: [dropped_network, dropped_turn]}}}, {required: [ice_connected, media_connected], properties: {ice_connected: {enum: ['true', unknown]}, media_connected: {enum: ['true', unknown]}}}]}}
      - {if: {required: [end_reason], properties: {end_reason: {not: {enum: [dropped_network, dropped_turn, unknown]}}}}, then: {properties: {dropped: {enum: [false, null]}}}}
    properties:
      call_id: {type: string, format: uuid}
      outcome_version: {type: integer, minimum: 0, x-change: new, x-review: S8}
      outcome_status: {$ref: '#/$defs/e_outcome_status', x-change: new}
      outcome_provenance: {$ref: '#/$defs/e_outcome_provenance', x-change: new, x-review: S8}
      finalized_ts: {type: [string, 'null'], format: date-time, x-change: new, x-review: S8}
      ring_ts: {type: [string, 'null'], format: date-time, description: 'Lúc BE nhận tin đổ chuông, không phải lúc thiết bị bắt đầu đổ', x-source-level: A, x-change: changed}
      answer_clicked_at_client: {type: [string, 'null'], format: date-time, x-source-level: B, x-change: new}
      answer_received_at_be: {type: [string, 'null'], format: date-time, description: Thay answer_ts, x-source-level: A, x-change: new}
      answer_observed_at_peer: {type: [string, 'null'], format: date-time, x-source-level: B, x-change: new}
      answered: {type: [boolean, 'null'], x-change: changed}
      answered_device_id: {type: [string, 'null']}
      ice_connected: {$ref: '#/$defs/e_tristate', description: Thay connected, x-change: new}
      dtls_connected: {$ref: '#/$defs/e_tristate', x-change: new}
      media_connected: {$ref: '#/$defs/e_tristate', description: false là đã xác nhận không đạt tiêu chí media trong khoảng đánh giá, x-change: new}
      media_connected_rule_version: {type: [string, 'null'], description: 'Một hay hai endpoint, chiều và loại media, mốc đánh giá', x-change: new}
      setup_failure_observed: {type: [boolean, 'null'], x-change: new}
      end_ts: {type: [string, 'null'], format: date-time, x-change: changed}
      duration_s: {type: [number, 'null'], minimum: 0}
      end_reason: {$ref: '#/$defs/e_end_reason'}
      dropped: {type: [boolean, 'null'], x-change: changed}
      caller_ctx_final: {anyOf: [{$ref: '#/$defs/ctx'}, {type: 'null'}], x-change: changed}
      callee_ctx_final: {anyOf: [{$ref: '#/$defs/ctx'}, {type: 'null'}], x-change: changed}
      pair_group: {anyOf: [{$ref: '#/$defs/e_pair_group'}, {type: 'null'}], x-change: changed}
      converted_to_group: {type: [boolean, 'null']}
      converted_ts: {type: [string, 'null'], format: date-time}
      n_ice_attempts: {type: [integer, 'null'], minimum: 0, x-change: changed}
      n_network_changes: {type: [integer, 'null'], minimum: 0, x-change: changed}
      stats_status: {anyOf: [{$ref: '#/$defs/e_stats_status'}, {type: 'null'}], x-change: changed}
      stats_sampling_prob: {type: [number, 'null'], minimum: 0, maximum: 1, x-change: changed}
