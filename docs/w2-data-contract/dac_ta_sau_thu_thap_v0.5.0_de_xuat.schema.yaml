- id: I27
  level: FAIL
  status: deferred
  enforced_by: pipeline
  rule: Hoãn cùng chuỗi RTP theo cửa sổ. Số A + N + U bằng độ dài chuỗi; hai chuỗi của một dòng có cùng độ dài;
    rtp_no_receive_window_count, rtp_recv_active_window_count, rtp_recv_unknown_window_count khớp chuỗi nhận.
x-deferred-rules:
  rtp_windows:
    A: Delta bộ đếm lớn hơn 0 trên hai snapshot hợp lệ của cùng đối tượng. Chỉ chứng minh có ít nhất một gói.
    N: Delta bằng 0 trên hai snapshot hợp lệ của cùng đối tượng. Có thể do hold, DTX, sender không gửi hoặc mất
      đường.
    U: Không đủ điều kiện xác định delta; không được thay bằng N.
    time: Có window_s, anchor và đồng hồ xác định qua metadata endpoint. window_idx của Caller không tương ứng index
      cùng số của Callee.
    start: Từ anchor_ts của endpoint, kể cả trước khi bắt máy; không tái dùng tập cửa sổ đánh giá được của §5.7.
    epoch_boundary: Cửa sổ thuộc epoch chứa điểm giữa, như §5.7.
    restart: Cửa sổ vẫn có phần tử, neo không đặt lại; đối tượng stats đổi thì U.
    hold_mute: Chuỗi vẫn ghi theo delta; trạng thái hold, mute lưu riêng khi biết.
    end: Cửa sổ dở dang không đủ hai snapshot thì U.
    two_strings: Cùng phạm vi index trong một endpoint; số cửa sổ và độ dài chuỗi phải nhất quán.
    limit: Gián đoạn không phủ trọn một cửa sổ sẽ không thấy. Contract không hứa phát hiện mọi gián đoạn ngắn.
    derived_stall: Chuỗi trạng thái là dữ liệu quan sát hoạt động gửi/nhận RTP theo cửa sổ. Nó không tự đủ để gán
      confirmed_receive_stall_*. Kết quả suy dẫn, nếu có, phải ghi phương pháp/version, phạm vi bằng chứng, độ phân
      giải và trạng thái chưa xác định. Tiêu chí xác nhận stall thuộc đặc tả detector riêng; contract chưa chốt
      tiêu chí đó.
x-review-flags:
  note: Chi tiết chọn khi viết schema, đang mở để Hiệp góp ý.
  S1: Bảng ice_attempt_endpoint và ice_connected_any_ts, để giữ mốc từng bên
  S8: outcome_log có outcome_version, outcome_provenance, finalized_ts; nhiều cột được null cho placeholder; first_media_definition
  S9: fact_call có pcr_group, poor_unattributed, action_propensity, propensity_decision_id; hai bên khác decision
    thì propensity null

$defs:
  # ---------- Kiểu chung và enum ----------
  e_confidence_level: {type: string, enum: [high, medium, low]}
  e_data_source: {type: string, enum: [synthetic, lab_zenodo, lab_controlled, public_reference, production], x-contract-ref: §1.1, description: lab_controlled là giá trị bổ sung cho lab tự làm, x-change: changed}
  e_producer: {type: string, enum: [client_sdk, signaling, selector, turn_server, probe_agent, simulator], x-contract-ref: §1.1}
  e_side: {type: string, enum: [caller, callee], x-contract-ref: §2}
  e_network_type: {type: string, enum: [wifi, 4g, 5g, ethernet, unknown], x-contract-ref: §2}
  e_platform: {type: string, enum: [ios, android, web, desktop, unknown], x-contract-ref: §2}
  e_info_level: {type: string, enum: [full, caller_only, country_only, none], x-contract-ref: §2}
  e_decision_phase: {type: string, enum: [initial, restart], x-contract-ref: §2, description: Bỏ refined vì Selector biết Callee ngay từ đầu, x-change: changed, x-review: S19}
  e_connection_mode: {type: string, enum: [post_answer, pre_connect], x-contract-ref: §2}
  e_ice_transport_policy: {type: string, enum: [relay, all], x-contract-ref: §2}
  e_transport: {type: string, enum: [udp, tcp, tls], x-contract-ref: §2, description: Giao thức từ client tới TURN}
  e_candidate_protocol: {type: string, enum: [udp, tcp], description: 'Giao thức của candidate, khác với giao thức từ client tới TURN', x-change: new}
  e_direction: {type: string, enum: [forward, reverse], x-contract-ref: §2}
  e_path_type: {type: string, enum: [relay_relay, relay_same, relay_unresolved, relay_direct, p2p_host, p2p_srflx, unknown], description: Xem x-rules.path_type, x-change: changed}
  e_candidate_type: {type: string, enum: [host, srflx, prflx, relay, unknown], x-contract-ref: §2}
  e_ice_trigger: {type: string, enum: [initial, restart_network_change, restart_failure, restart_disconnected, restart_quality], description: 'Bỏ fallback; thêm restart_disconnected, restart_quality', x-change: changed}
  e_ice_state: {type: string, enum: [connected, failed, timeout, cancelled, unknown], x-contract-ref: §2, description: Trạng thái cuối của attempt, x-change: changed}
  e_ice_role: {type: string, enum: [controlling, controlled, unknown], x-contract-ref: W3C, x-change: new}
  e_end_reason: {type: string, enum: [normal_hangup, invite_undelivered, not_answered, rejected, cancelled_by_caller, ice_failed, media_setup_failed, dropped_network, dropped_turn, app_crash, unknown], x-contract-ref: §2, description: Thêm media_setup_failed, x-change: changed}
  e_pair_group: {type: string, enum: [VN_VN, VN_INTL, INTL_INTL], x-contract-ref: §2}
