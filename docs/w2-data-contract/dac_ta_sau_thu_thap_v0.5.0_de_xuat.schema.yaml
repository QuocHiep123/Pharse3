# Đặc tả các lớp sau thu thập, đi kèm Data Contract v0.5.0 (đề xuất). JSON Schema 2020-12 trên YAML.
# Đây là bản chuyển tiếp để không mất nội dung khi tách contract thu thập. Đặc tả đầy đủ của từng lớp viết sau.
# Enum và object dùng chung được chép từ contract để file validate được độc lập.
#
# Cách đọc: như contract. x-status: pending là chưa đủ cột; deferred là hoãn.

$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:turn-selector:post-collection-spec:0.5.0-de-xuat
title: Đặc tả các lớp sau thu thập v0.5.0 (đề xuất)
description: Gồm pipeline làm sạch, Outcome Log, Feature Engineering, Labeled Data, Evaluation, giả lập và API Selector.
  Tệp không ràng buộc gì ở gốc; mỗi bảng được validate qua $defs.

x-spec:
  version: 0.5.0-de-xuat
  based_on: 0.4.0, commit e4d84f8, nhánh docs/w1-design-and-data-contract
  contract_schema: data_contract_v0.5.0_de_xuat.schema.yaml
  proposal_document: De_xuat_Data_Contract_v0.5.0_cho_Hiep.md
  status: Bản chuyển tiếp để không mất nội dung khi tách contract thu thập. Giữ nguyên nghĩa của bản đề xuất trước,
    chỉ sửa chỗ buộc phải đổi theo ranh giới mới. Đặc tả đầy đủ của từng lớp viết sau.
x-layers:
  Pipeline làm sạch: Tính từ raw theo một quy tắc, dù chỉ trên một dòng hoặc một cuộc gọi
  Feature Engineering: Cần cửa sổ thời gian, trọng số, gộp theo nhóm mạng hoặc suy ra từ nhiều cuộc gọi
  Labeled Data: Nối Decision Log với Outcome Log rồi gắn nhãn; không tạo thêm dự đoán
  Evaluation: KPI và so sánh
  Giả lập: Truth ẩn và hồ sơ lần chạy
  API và vận hành Selector: Giao tiếp giữa BE và Selector
x-rules:
  path_type:
    relay_same: Hai candidate là relay, hai máy TURN được xác định và trùng nhau
    relay_relay: Hai candidate là relay, hai máy TURN được xác định và khác nhau
    relay_unresolved: Hai candidate là relay, chưa đủ biết cùng hay khác máy. Không suy từ cấu hình ice_transport_policy.
    relay_direct: Đúng một đầu là relay
    p2p_host: Cả hai đầu là host
    p2p_srflx: Không đầu nào relay và có srflx hoặc prflx
    unknown: Thiếu loại candidate để xác định đường
    'null': Không áp dụng hoặc chưa có selected path
  turn_identity:
    lookup: 'Tra dim_turn_endpoint theo thời điểm quan sát và vai trò listen, relay, both phù hợp; lấy tập turn_id
      phân biệt. Thứ tự nguồn: relayed_ip của cặp được chọn, relayed_ip của allocation đã dùng, turn_server_ip,
      hostname.'
    identified: Một máy, không có bằng chứng mâu thuẫn. Chỉ khi này actual_turn_id có giá trị.
    ambiguous: Nhiều máy chưa phân giải
    unmapped: Không có kết quả
    tie_break: Không dùng TURN do Selector yêu cầu để phá hòa. Nguồn server hoặc endpoint độc lập có thể phân giải
      nếu ghi rõ nguồn gốc.
    missing: Cuộc gọi vẫn trong KPI tổng; thống kê theo máy không được gán bừa.
  path_attribution:
  - SDK không hỗ trợ thì unknown, không mặc định single_path.
  - Bộ đếm tăng mà không có timeline thì biết có đổi, không biết đường trung gian; không tạo path epoch giả.
  - Epoch mixed hoặc unknown vẫn vào KPI toàn cuộc gọi, nhưng không gán chất lượng cho TURN đầu hay cuối.
  - Feature theo đường chỉ dùng phần single_path, và báo coverage bị loại.
  - Không dùng cùng quy tắc để xóa số liệu tải và allocation đo được ở hạ tầng.
  outcome_placeholder: Không tự điền false; có quy tắc cutoff, dữ liệu đến muộn, version; dòng cuối là duy nhất
    trong view hiện hành; có nguồn gốc cho placeholder và event thật.
  end_reason: Phân loại từ end_signal, client_end_reason và sự kiện ICE, có version. dropped_turn chỉ khi có bằng
    chứng về TURN; không đủ bằng chứng thì unknown.
  estimates: Số ước lượng không ghi đè dữ liệu thô và không gộp phân phối với số đo trực tiếp. policy_version là
    đủ nếu tham chiếu bất biến tới đúng estimator, gate và cấu hình đã dùng; nếu tạo offline độc lập thì cần gate_rule_version.
    Ngưỡng gate nằm ngoài contract.
  be_and_outcome: BE không cộng vào RTT, loss, jitter của một đường cố định, nhưng signaling có thể ảnh hưởng thiết
    lập và cuộc đua candidate. Không khẳng định BE không ảnh hưởng pcr_itt.
x-feature-engineering:
  leg: 'Mô hình theo mục 4.4 của VIA: một đường gồm đoạn từ nhóm mạng đến TURN của mỗi bên, cộng chặng giữa khi
    hai TURN khác nhau. Cặp (A, A) không có chặng giữa.'
  backbone: Từ turn_probe. Thiếu probe thì chỉ ước lượng được khi có mẫu dùng chung TURN.
  metrics: Làm RTT trước. Loss và jitter ưu tiên lịch sử trực tiếp; log(1 − loss) cộng được khi các chặng độc lập,
    jitter cộng xấp xỉ.
  by_sample_count: Đường nhiều mẫu dùng lịch sử trực tiếp, đường ít mẫu mới ghép chặng.
  evaluation: Đánh giá trên tập giữ lại, theo số lần đường xuất hiện khi học; chỉ số là độ phủ, sai số và mức chênh
    so với cặp tốt nhất.
  unestimable: Đường không ước lượng được thì không có khoảng tin cậy, nên top-k cần quy tắc riêng.
x-labeled-data:
  definition: Nối Decision Log với Outcome Log rồi gắn nhãn; không tạo thêm dự đoán. Chưa định nghĩa cột.
  sources:
  - selector_decision
  - selector_decision_pair
  - outcome_log
  - ice_attempt
  - call_stats_epoch
  join_keys:
  - call_id
  - decision_id
  - side
  - device_id
  - pc_id
  - ice_generation
  - local_turn_url, relayed_ip_* và thời điểm
  moved_from:
  - 'fact_call: pcr_group, poor_category, quality_assessment_status, action_propensity, propensity_decision_id,
    rank_used_*, lead_pair_matched'
  - x-metrics
  open_questions:
  - 'Một dòng là gì: mỗi quyết định, mỗi bên hay mỗi cặp?'
  - Cuộc gọi thiết lập thất bại không có cặp thực tế, vậy nhãn gắn vào cặp dẫn đầu thế nào?
  - Dự đoán và kết quả có cùng đại lượng không, ví dụ media_rtcp_rtt hay ice_stun_rtt?
x-metrics:
  cohort: Bắt đầu từ call_session có call_type = one_to_one đã chốt cohort, rồi left join outcome. Cuộc gọi đang
    diễn ra để báo cáo tạm. Trong giả lập, policy lấy từ run_manifest.policy_version, vì arm đã hoãn. Phạm vi dữ
    liệu theo x-rules.relay_scope của contract.
  classification_order:
  - group: K
    rule: Có đủ bằng chứng cho setup_fail, drop hoặc quality_poor trên cuộc gọi đã có media
  - group: G
    rule: 'Đủ bằng chứng không poor: answered = false; hoặc end_reason = app_crash khi media chưa nối và không có
      sự kiện lỗi thiết lập đã quan sát; hoặc media đã nối, không rớt, quality_ok'
  - group: U_quality
    rule: answered = true, media_connected = true, dropped = false, quality_unknown
  - group: U_outcome
    rule: Còn lại
  setup_fail: 'answered = true, media_connected = false, và có một trong hai: setup_failure_observed = true, hoặc
    end_reason đã biết và khác app_crash. end_reason = unknown không phải bằng chứng không crash.'
  pcr_itt_low: '|K| / N'
  pcr_itt_high: (|K| + |U|) / N
  unclassifiable_rate: '|U_quality| / N. Tên giữ lại nhưng điều kiện chuyển từ connected sang media_connected, nên
    là thay đổi nghĩa.'
  outcome_unknown_rate: '|U_outcome| / N'
  undetermined_rate: '|U| / N = unclassifiable_rate + outcome_unknown_rate = pcr_itt_high − pcr_itt_low'
  zero_denominator: N = 0 thì metric không xác định, không điền 0.
  same_basis: Mọi tỷ lệ dùng cùng cohort, cutoff và đơn vị.
  alloc_success_rate: Có điều kiện trên giao dịch đã biết kết quả; xuất thêm số known, unknown và coverage.
  fault_to_recovery_ms: Chỉ khi biết mốc fault, tức trong truth hoặc thí nghiệm có kiểm soát.
  cst_technical: Dùng checking_to_connected_ms của ice_attempt_endpoint, trên cùng đồng hồ. Dựa trên proxy nếu không
    có hook thì phải ghi rõ.
  connected_consumers_to_update: I6, I7, I23, §13.2, pnr, pcr_answered, quality_assessment_status ở §8.4
  poor_bottleneck_share: Chẩn đoán có điều kiện, kèm coverage và nhãn measured hoặc estimated; không kết luận last
    mile chỉ vì số suy ra lớn nhất nằm ở user↔TURN.
  additive_from_plan:
  - tỷ lệ cặp thực tế khớp cặp dẫn đầu
  - độ dao động danh sách
  - phân bố kích thước top-k và tỷ lệ chạm trần
  - độ phủ khoảng theo interval_kind
  detected_to_ice_recovery_ms: Từ lúc client phát hiện đến khi ICE nối lại, tính từ ice_event. Mốc media trở lại
    đang hoãn.
  ttfm: 'ttfm_post_answer_p95 của v0.4.0 lấy max hai bên so với answer_ts. Viết lại theo từng bên, trên đồng hồ
    của chính bên đó: Callee dùng answer_clicked_at_client, Caller dùng answer_observed_at_peer, cùng với first_media_received_ts
    của đầu đó.'
x-invariants:
- id: I5
  level: WARN
  status: changed
  enforced_by: pipeline
  rule: 'Chỉ các quan hệ nhân quả, dung sai đồng hồ 2 s, như §7 v0.4.0 với tên mốc mới: answer_ts đổi thành answer_received_at_be;
    ice_connected_ts và dtls_connected_ts lấy từ ice_attempt_endpoint. Không dùng để khẳng định độ chính xác của
    duration.'
- id: I6
