x-deferred-rules:
  rtp_windows:
    A: Delta bộ đếm lớn hơn 0 trên hai snapshot hợp lệ của cùng đối tượng. Chỉ chứng minh có ít nhất một gói.
    N: Delta bằng 0 trên hai snapshot hợp lệ của cùng đối tượng. Có thể do hold, DTX, sender không gửi hoặc mất
      đường.
    U: Không đủ điều kiện xác định delta; không được thay bằng N.
    time: Có window_s, anchor và đồng hồ xác định qua metadata endpoint. window_idx của Caller không tương ứng index
      cùng số của Callee.
    start: Từ anchor_ts của endpoint, kể cả trước khi bắt máy; không tái dùng tập cửa sổ đánh giá được của §5.7.
    epoch_boundary: Cửa sổ thuộc epoch chứa điểm giữa, như §5.7.
    restart: Cửa sổ vẫn có phần tử, neo không đặt lại; đối tượng stats đổi thì U.
    hold_mute: Chuỗi vẫn ghi theo delta; trạng thái hold, mute lưu riêng khi biết.
    end: Cửa sổ dở dang không đủ hai snapshot thì U.
    two_strings: Cùng phạm vi index trong một endpoint; số cửa sổ và độ dài chuỗi phải nhất quán.
    limit: Gián đoạn không phủ trọn một cửa sổ sẽ không thấy. Contract không hứa phát hiện mọi gián đoạn ngắn.
    derived_stall: Chuỗi trạng thái là dữ liệu quan sát hoạt động gửi/nhận RTP theo cửa sổ. Nó không tự đủ để gán
      confirmed_receive_stall_*. Kết quả suy dẫn, nếu có, phải ghi phương pháp/version, phạm vi bằng chứng, độ phân
      giải và trạng thái chưa xác định. Tiêu chí xác nhận stall thuộc đặc tả detector riêng; contract chưa chốt
      tiêu chí đó.
x-review-flags:
  note: Chi tiết chọn khi viết schema, đang mở để Hiệp góp ý.
  S1: Bảng ice_attempt_endpoint và ice_connected_any_ts, để giữ mốc từng bên
  S8: outcome_log có outcome_version, outcome_provenance, finalized_ts; nhiều cột được null cho placeholder; first_media_definition
  S9: fact_call có pcr_group, poor_unattributed, action_propensity, propensity_decision_id; hai bên khác decision
    thì propensity null

$defs:
  # ---------- Kiểu chung và enum ----------
  e_confidence_level: {type: string, enum: [high, medium, low]}
  e_data_source: {type: string, enum: [synthetic, lab_zenodo, lab_controlled, public_reference, production], x-contract-ref: §1.1, description: lab_controlled là giá trị bổ sung cho lab tự làm, x-change: changed}
  e_producer: {type: string, enum: [client_sdk, signaling, selector, turn_server, probe_agent, simulator], x-contract-ref: §1.1}
  e_side: {type: string, enum: [caller, callee], x-contract-ref: §2}
  e_network_type: {type: string, enum: [wifi, 4g, 5g, ethernet, unknown], x-contract-ref: §2}
  e_platform: {type: string, enum: [ios, android, web, desktop, unknown], x-contract-ref: §2}
  e_info_level: {type: string, enum: [full, caller_only, country_only, none], x-contract-ref: §2}
  e_decision_phase: {type: string, enum: [initial, restart], x-contract-ref: §2, description: Bỏ refined vì Selector biết Callee ngay từ đầu, x-change: changed, x-review: S19}
  e_connection_mode: {type: string, enum: [post_answer, pre_connect], x-contract-ref: §2}
  e_ice_transport_policy: {type: string, enum: [relay, all], x-contract-ref: §2}
  e_transport: {type: string, enum: [udp, tcp, tls], x-contract-ref: §2, description: Giao thức từ client tới TURN}
  e_candidate_protocol: {type: string, enum: [udp, tcp], description: 'Giao thức của candidate, khác với giao thức từ client tới TURN', x-change: new}
  e_direction: {type: string, enum: [forward, reverse], x-contract-ref: §2}
  e_path_type: {type: string, enum: [relay_relay, relay_same, relay_unresolved, relay_direct, p2p_host, p2p_srflx, unknown], description: Xem x-rules.path_type, x-change: changed}
  e_candidate_type: {type: string, enum: [host, srflx, prflx, relay, unknown], x-contract-ref: §2}
  e_ice_trigger: {type: string, enum: [initial, restart_network_change, restart_failure, restart_disconnected, restart_quality], description: 'Bỏ fallback; thêm restart_disconnected, restart_quality', x-change: changed}
  e_ice_state: {type: string, enum: [connected, failed, timeout, cancelled, unknown], x-contract-ref: §2, description: Trạng thái cuối của attempt, x-change: changed}
  e_ice_role: {type: string, enum: [controlling, controlled, unknown], x-contract-ref: W3C, x-change: new}
  e_end_reason: {type: string, enum: [normal_hangup, invite_undelivered, not_answered, rejected, cancelled_by_caller, ice_failed, media_setup_failed, dropped_network, dropped_turn, app_crash, unknown], x-contract-ref: §2, description: Thêm media_setup_failed, x-change: changed}
  e_pair_group: {type: string, enum: [VN_VN, VN_INTL, INTL_INTL], x-contract-ref: §2}
  e_health_status: {type: string, enum: [healthy, degraded, overloaded, down, maintenance, unknown], description: Mô tả sức khỏe server. degraded chỉ gán khi có nguồn, x-change: changed}
  e_match_method: {type: string, enum: [id, rule, token, ambiguous], x-contract-ref: §8.3, description: 'token: nối qua định danh theo phạm vi cuộc gọi', x-change: changed}
  e_filter_reason: {type: string, enum: [down, overloaded, degraded, maintenance, policy, health_stale], x-contract-ref: §5.2, description: Thêm health_stale, x-change: changed}
  e_stats_status: {type: string, enum: [kept_critical, kept_sampled, not_sampled, truncated, lost, not_applicable], x-contract-ref: §2}
  e_quality_assessment_status: {type: string, enum: [assessed, partially_assessed, unclassifiable, not_applicable], x-contract-ref: §2}
  e_run_kind: {type: string, enum: [scripted, blind_benchmark, dev], x-contract-ref: §2}
  e_tristate: {type: string, enum: ['true', 'false', unknown], description: 'false là đã xác nhận, không phải chưa có dữ liệu', x-change: new}
  e_outcome_status: {type: string, enum: [complete, partial, missing], description: Không trực tiếp quyết định nhãn poor, x-change: new}
  e_outcome_provenance: {type: string, enum: [event, placeholder], x-change: new}
  e_observation_profile: {type: string, enum: [obs_base, obs_active, obs_infra], x-change: new, description: obs_estimator hoãn cùng candidate_observation}
  e_capability: {type: string, enum: [supported, unsupported, not_configured], x-change: new}
  e_value_kind: {type: string, enum: [measured, estimated], description: sim_truth chỉ nằm ở bảng truth, x-change: new}
  e_selection_method: {type: string, enum: [deterministic, greedy, thompson, ucb, epsilon, static], x-change: new}
  e_propensity_method: {type: string, enum: [exact, monte_carlo, not_estimated], x-change: new}
  e_list_role: {type: string, enum: [lead, topk, failure_domain_backup, transport_backup, padding], x-change: new}
  e_interval_kind: {type: string, enum: [mean_ci, prediction, other], description: Khoảng cho giá trị trung bình khác khoảng dự đoán từng cuộc gọi, x-change: new}
  e_gate_status: {type: string, enum: [passed, failed, not_evaluated, not_applicable], x-change: new}
  e_validation_status: {type: string, enum: [not_validated, validated, rejected], x-change: new}
  e_estimand: {type: string, enum: [network_rtt, transaction_time, candidate_total_time], x-change: new}
  e_failure_phase: {type: string, enum: [none, pre_allocation, post_allocation, mid_call, unknown], description: 'Thời điểm hỏng của TURN trong cuộc gọi (kịch bản TURN Failure). pre_allocation: Allocate lỗi; post_allocation: cấp phát được nhưng ICE/media không đạt; mid_call: hỏng khi đã có media, cần ICE restart. unknown khi thiếu bằng chứng, không suy ra none.', x-change: new}
  e_call_path_scope: {type: string, enum: [p2p, relay, failed, unknown], description: 'Issue #7. Phạm vi đường của cuộc gọi suy từ bằng chứng ICE (không suy từ ice_transport_policy). failed = đã bắt máy nhưng ICE hoặc media không đạt; unknown = chưa đủ bằng chứng.', x-change: new}
  e_label_status: {type: string, enum: [observed, not_observable, setup_failed, identity_unresolved, not_actual_pair], description: 'Trạng thái nhãn của một cặp dự đoán. observed: cặp này là cặp thực tế và metric đo được cùng đại lượng. not_actual_pair: cặp được cân nhắc nhưng không được dùng, không có nhãn phản thực. setup_failed: cuộc gọi thất bại, nhãn chỉ cho metric thành công. identity_unresolved: chưa xác định TURN thực tế. not_observable: thiếu telemetry hoặc khác đại lượng.', x-change: new}
  e_turn_availability_status: {type: string, enum: [local_turn_available, no_healthy_turn, no_turn_observed, unknown], description: 'Issue #5. Trạng thái TURN khả dụng theo country của endpoint tại lúc quyết định. no_turn_observed không đồng nghĩa not_deployed; chỉ kết luận not_deployed khi inventory_scope đã xác nhận đầy đủ.', x-change: new}
  e_turn_identity_status: {type: string, enum: [identified, ambiguous, unmapped, unknown], x-change: new}
  e_turn_identity_method: {type: string, enum: [ip, hostname, server_evidence, none], x-contract-ref: §8.6, description: ambiguous chuyển sang turn_identity_status, x-change: changed}
  e_identity_check: {type: string, enum: [match, mismatch, not_evaluable], description: Kết quả I19, x-change: new}
  e_path_attribution_status: {type: string, enum: [single_path, mixed, unknown], x-change: new}
  e_pcr_group: {type: string, enum: [K, G, U_quality, U_outcome], x-change: new}
  e_poor_category: {type: string, enum: [setup_fail, drop, quality, poor_unattributed, none], x-contract-ref: §8.4, description: 'poor_unattributed: chắc chắn poor nhưng chưa rõ nhánh', x-change: changed}
  e_user_cohort: {type: string, enum: [normal, cold_start], x-contract-ref: §3.3}
  e_geo_source: {type: string, enum: [ip_geo, sdk_claimed, both, unknown], x-contract-ref: §4, description: unknown cho ctx chưa biết, x-change: changed}
  e_vn_region: {type: string, enum: [north, central, south, unknown], x-contract-ref: §1, description: null là không áp dụng}
  e_fallback_type: {type: string, enum: [data_backoff, health_missing, selector_error, insufficient_candidates], x-change: new}
  e_segment_level: {type: string, enum: [L4, L3, L2, L1, LA, L0], x-contract-ref: §9.0, description: 'LA: cấp khu vực, bổ sung', x-change: changed}
  e_leg_stat_direction: {type: string, enum: [user_to_turn, turn_to_user], x-contract-ref: §9.1}
  e_leg_stat_metric: {type: string, enum: [one_way_observed, rtt], x-contract-ref: §9.1}
  e_clock_quality_flag: {type: string, enum: [ok, corrected, unreliable], x-contract-ref: §8.1}
  e_dq_level: {type: string, enum: [FAIL, WARN], x-contract-ref: §7}
  e_dq_status: {type: string, enum: [pass, fail, warn, not_evaluable], x-contract-ref: §8.5, description: 'not_evaluable: chưa đủ bằng chứng', x-change: changed}
  e_observation_state: {type: string, enum: [measured, not_measured, stale, lost, ambiguous, not_applicable], description: Trạng thái của một quan sát, x-change: new}
  e_metric_mode: {type: string, enum: [active, reporting_only], description: Cấu hình bộ KPI, x-change: new}
  e_metric_scope: {type: string, enum: [outcome_all_calls, telemetry_observed, turn_infrastructure, service_operations, algorithm_decision, sim_oracle], description: 'Outcome dùng toàn cohort; quality chỉ dùng phần có phép đo; turn_infrastructure: từ log/exporter TURN; service_operations: từ API Selector; algorithm_decision: so quyết định với kết quả; sim_oracle: chỉ synthetic, đọc truth'}
  e_metric_assessment: {type: string, enum: [measured, not_measured, lost, stale, ambiguous, not_applicable], description: Trạng thái của một lần tính metric}

  # ---------- Object dùng chung ----------
  event_envelope:
    title: Cột chung của mọi bảng event thô (§1.1)
    type: object
    properties:
      event_id: {type: string, format: uuid, description: 'Duy nhất, dùng dedup'}
      contract_version: {type: string}
      data_source: {$ref: '#/$defs/e_data_source'}
      producer: {$ref: '#/$defs/e_producer'}
      event_ts: {type: string, format: date-time, description: Theo đồng hồ producer; pipeline không ghi đè}
      ingest_ts: {type: string, format: date-time, description: Lúc collector nhận}
      sim_run_id: {type: [string, 'null'], description: Bắt buộc khi data_source = synthetic}
      dt: {type: string, format: date, description: Ngày UTC của event_ts}
    required: [event_id, contract_version, data_source, producer, event_ts, ingest_ts, dt]
    allOf:
      - {if: {required: [data_source], properties: {data_source: {const: synthetic}}}, then: {required: [sim_run_id], properties: {sim_run_id: {not: {type: 'null'}}}}}
  derived_meta:
    title: Cột chung của bảng do pipeline dựng
    type: object
    properties:
      contract_version: {type: string}
      data_source: {$ref: '#/$defs/e_data_source'}
      sim_run_id: {type: [string, 'null']}
      pipeline_run_id: {type: string}
      dt: {type: string, format: date}
    required: [contract_version, data_source, pipeline_run_id, dt]
    allOf:
      - {if: {required: [data_source], properties: {data_source: {const: synthetic}}}, then: {required: [sim_run_id], properties: {sim_run_id: {not: {type: 'null'}}}}}
  metric_observation:
    title: Một metric chất lượng của một endpoint trên các cửa sổ quan sát được
    type: object
    properties:
      value: {type: [number, 'null'], minimum: 0, description: Giá trị gộp; null khi không đo được}
      p50: {type: [number, 'null'], minimum: 0}
      p95: {type: [number, 'null'], minimum: 0}
      sample_count: {type: integer, minimum: 0, description: Số mẫu hợp lệ; 0 là không có mẫu, không phải giá trị metric bằng 0}
      eligible_count: {type: [integer, 'null'], minimum: 0, description: Số cửa sổ đủ điều kiện theo phạm vi thu thập; null nếu không biết}
      measurement_coverage: {type: [number, 'null'], minimum: 0, maximum: 1, description: sample_count / eligible_count khi mẫu số dương}
      assessment: {$ref: '#/$defs/e_metric_assessment'}
      metric_definition_version: {type: string}
      source_table: {type: string}
    required: [sample_count, eligible_count, measurement_coverage, assessment, metric_definition_version, source_table]
    allOf:
      - {if: {required: [assessment], properties: {assessment: {const: measured}}}, then: {properties: {sample_count: {minimum: 1}}}}
      - {if: {required: [assessment], properties: {assessment: {enum: [not_measured, lost, stale, ambiguous, not_applicable]}}}, then: {properties: {value: {type: 'null'}, p50: {type: 'null'}, p95: {type: 'null'}}}}
    additionalProperties: false
  ctx:
    title: Bối cảnh một bên lúc quyết định (§4). Field chưa biết ghi unknown
    type: object
    properties:
      user_hash: {type: [string, 'null']}
      country: {type: string}
      vn_region: {anyOf: [{$ref: '#/$defs/e_vn_region'}, {type: 'null'}]}
      city: {type: string}
      isp: {type: string}
      asn: {type: [integer, 'null']}
      network_type: {$ref: '#/$defs/e_network_type'}
      geo_source: {$ref: '#/$defs/e_geo_source'}
      geo_mismatch: {type: [boolean, 'null']}
      device_id: {type: string}
      platform: {$ref: '#/$defs/e_platform'}
      os_version: {type: [string, 'null']}
      app_version: {type: [string, 'null']}
      sdk_version: {type: [string, 'null']}
      device_model: {type: [string, 'null']}
      browser_name: {type: [string, 'null']}
      browser_version: {type: [string, 'null']}
    required: [country, city, isp, network_type, geo_source, device_id, platform]
    additionalProperties: false
    x-moved-columns: [{column: segment_key, to: Feature Engineering}]
  list_entry:
    title: 'Một mục trong danh sách đã cấp: một URL trên một server với một giao thức'
    type: object
    properties:
      entry_id: {type: string, description: Khóa trong một danh sách, x-change: new}
      rank: {type: integer, minimum: 1, description: 'Vị trí trong danh sách, liên tục từ 1'}
      turn_id: {type: [string, 'null'], description: Có thể null nếu mục là endpoint hoặc pool chưa gắn máy, x-change: changed}
      config_ref: {type: [string, 'null'], description: URL hoặc tham chiếu cấu hình, x-change: new}
      normalized_config_key: {type: string, description: Định nghĩa duplicate trong một danh sách, x-change: new, x-review: S4}
      client_turn_transport: {$ref: '#/$defs/e_transport', description: Selector muốn dùng giao thức nào tới TURN, x-change: new}
      roles: {type: array, items: {$ref: '#/$defs/e_list_role'}, x-change: new}
      score: {type: [number, 'null'], description: Chỉ so trong một decision}
      score_components: {type: [object, 'null'], description: Gồm backoff_level; hạ ưu tiên do tải ghi tại đây theo quy ước}
      reason_codes: {type: [array, 'null'], items: {type: string}}
    required: [entry_id, rank, normalized_config_key, client_turn_transport, roles]
    additionalProperties: false
  filtered_turn:
    title: TURN bị lọc
    type: object
    properties:
      turn_id: {type: string}
      reason: {$ref: '#/$defs/e_filter_reason'}
    required: [turn_id, reason]
    additionalProperties: false
  excluded_turn:
    title: TURN client yêu cầu loại
    type: object
    properties:
      turn_id: {type: string}
      reason: {type: [string, 'null'], x-change: additive}
    required: [turn_id]
    additionalProperties: false
  confidence_evidence:
    title: Căn cứ của mức tin cậy
    type: object
    properties:
      segment_level: {anyOf: [{$ref: '#/$defs/e_segment_level'}, {type: 'null'}]}
      n_calls: {type: [integer, 'null'], minimum: 0}
      note: {type: [string, 'null']}
    required: []
    additionalProperties: false
  eligible_action_set:
    title: Tham chiếu tới tập hành động đủ điều kiện
    type: object
    properties:
      ref: {type: string, description: 'Object hoặc snapshot bất biến, định vị được'}
      content_hash: {type: [string, 'null'], description: 'Chỉ để kiểm tra nội dung, không tự dựng lại hành động'}
    required: [ref]
    additionalProperties: false
  list_lead_pair:
    title: Cặp dẫn đầu
    type: object
    properties:
      turn_caller: {type: string}
      turn_callee: {type: string}
      transport_caller: {anyOf: [{$ref: '#/$defs/e_transport'}, {type: 'null'}]}
      transport_callee: {anyOf: [{$ref: '#/$defs/e_transport'}, {type: 'null'}]}
    required: [turn_caller, turn_callee]
    additionalProperties: false
  side_list:
    title: Danh sách cho một bên trong SelectResponse
    type: object
    properties:
      entries: {type: array, items: {$ref: '#/$defs/list_entry'}}
      filtered_out: {type: array, items: {$ref: '#/$defs/filtered_turn'}}
      returned_list_size: {type: integer, minimum: 0}
      is_exploration: {type: boolean}
    required: [entries, filtered_out, returned_list_size, is_exploration]
    additionalProperties: false
  pair_prediction:
    title: Một cặp được cân nhắc trong SelectResponse; BE chép vào selector_decision_pair
    type: object
    properties:
      turn_caller: {type: string}
      turn_callee: {type: string}
      transport_caller: {$ref: '#/$defs/e_transport'}
      transport_callee: {$ref: '#/$defs/e_transport'}
      metric: {type: string}
      unit: {type: string}
      est_value: {type: [number, 'null']}
      interval_low: {type: [number, 'null']}
      interval_high: {type: [number, 'null']}
      interval_kind: {anyOf: [{$ref: '#/$defs/e_interval_kind'}, {type: 'null'}]}
      interval_level: {type: [number, 'null'], minimum: 0, maximum: 1}
      in_topk: {type: boolean}
      is_lead: {type: boolean}
      estimate_source: {type: [string, 'null']}
      estimator_version: {type: [string, 'null']}
      input_snapshot_id: {type: [string, 'null'], description: Cutoff hoặc snapshot nguồn}
      gate_status: {$ref: '#/$defs/e_gate_status'}
      gate_reason: {type: [string, 'null']}
      gate_rule_version: {type: [string, 'null'], description: Cần nếu policy_version không tham chiếu bất biến tới quy tắc}
    required: [turn_caller, turn_callee, transport_caller, transport_callee, metric, unit, in_topk, is_lead, gate_status]
    additionalProperties: false

  # ---------- Pipeline làm sạch ----------
  outcome_log:
    title: 'Outcome Log: view sau pipeline'
    x-kind: derived
    x-grain: Một phiên bản outcome của một cuộc gọi; view hiện hành có một dòng
    x-contract-ref: §5.9
    x-primary-key: [call_id, outcome_version]
    x-foreign-keys: [{columns: [call_id], references: call_session}]
    x-producer: 'pipeline, từ call_outcome, client_call_report, ice_event, call_stats_epoch'
    x-change: new
    x-review: S8
    x-notes: [Phân tích bắt đầu từ call_session rồi left join; không có dòng outcome thì cuộc gọi vẫn ở trong cohort, Placeholder không tự điền false, 'Cặp được chọn lấy từ ice_attempt, tóm tắt chất lượng từ call_stats_epoch, nối theo call_id']
    type: object
    allOf:
      - {$ref: '#/$defs/derived_meta'}
      - {if: {required: [answered], properties: {answered: {const: false}}}, then: {required: [end_reason], properties: {end_reason: {enum: [invite_undelivered, not_answered, rejected, cancelled_by_caller, unknown]}}}}
      - {if: {required: [end_reason], properties: {end_reason: {const: ice_failed}}}, then: {required: [answered, ice_connected], properties: {answered: {const: true}, ice_connected: {const: 'false'}}}}
      - {if: {required: [end_reason], properties: {end_reason: {const: media_setup_failed}}}, then: {required: [answered, ice_connected, media_connected], properties: {answered: {const: true}, ice_connected: {const: 'true'}, media_connected: {const: 'false'}}}}
      - {if: {required: [answered, media_connected], properties: {answered: {const: true}, media_connected: {const: 'false'}}}, then: {required: [end_reason], properties: {end_reason: {enum: [ice_failed, media_setup_failed, normal_hangup, app_crash, unknown]}}}}
      - {if: {required: [end_reason], properties: {end_reason: {enum: [dropped_network, dropped_turn]}}}, then: {required: [dropped], properties: {dropped: {const: true}}}}
      - {if: {required: [dropped], properties: {dropped: {const: true}}}, then: {allOf: [{required: [answered, end_reason], properties: {answered: {const: true}, end_reason: {enum: [dropped_network, dropped_turn]}}}, {required: [ice_connected, media_connected], properties: {ice_connected: {enum: ['true', unknown]}, media_connected: {enum: ['true', unknown]}}}]}}
      - {if: {required: [end_reason], properties: {end_reason: {not: {enum: [dropped_network, dropped_turn, unknown]}}}}, then: {properties: {dropped: {enum: [false, null]}}}}
    properties:
      call_id: {type: string, format: uuid}
      outcome_version: {type: integer, minimum: 0, x-change: new, x-review: S8}
      outcome_status: {$ref: '#/$defs/e_outcome_status', x-change: new}
      outcome_provenance: {$ref: '#/$defs/e_outcome_provenance', x-change: new, x-review: S8}
      finalized_ts: {type: [string, 'null'], format: date-time, x-change: new, x-review: S8}
      ring_ts: {type: [string, 'null'], format: date-time, description: 'Lúc BE nhận tin đổ chuông, không phải lúc thiết bị bắt đầu đổ', x-source-level: A, x-change: changed}
      answer_clicked_at_client: {type: [string, 'null'], format: date-time, x-source-level: B, x-change: new}
      answer_received_at_be: {type: [string, 'null'], format: date-time, description: Thay answer_ts, x-source-level: A, x-change: new}
      answer_observed_at_peer: {type: [string, 'null'], format: date-time, x-source-level: B, x-change: new}
      answered: {type: [boolean, 'null'], x-change: changed}
      answered_device_id: {type: [string, 'null']}
