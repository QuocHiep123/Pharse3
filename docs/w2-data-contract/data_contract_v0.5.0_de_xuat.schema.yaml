    - Context hiện hành của epoch là version lớn nhất đã ingest tại cutoff. Không dùng thông tin đến sau cutoff cho feature quá khứ.
    - Thiếu khả năng phát hiện đổi mạng phải ghi telemetry_coverage; vắng dòng không chứng minh không đổi mạng.
    - epoch_start_ts là thời điểm client báo; observed_ts/event_ts là đồng hồ BE. Không tính delay bằng phép trừ hai đồng hồ này.
