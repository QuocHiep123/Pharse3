# Data Contract v0.5.0 (đề xuất): contract thu thập, viết bằng JSON Schema 2020-12 trên YAML.
# Đi kèm De_xuat_Data_Contract_v0.5.0_cho_Hiep.md, so với contract v0.4.0 tại commit e4d84f8.
# Trạng thái: v0.5.0 dùng cho simulator; nguồn production chờ xác nhận theo issue #3.
#
# Phạm vi: dữ liệu một nguồn ghi trực tiếp, Decision Log và bảng tham chiếu.
# Pipeline, Feature Engineering, Labeled Data, KPI, giả lập và API nằm ở dac_ta_sau_thu_thap_v0.5.0_de_xuat.schema.yaml.
#
# Cách đọc:
#   - Mỗi bảng là một mục trong $defs, có x-status: active hoặc deferred.
#   - Cột ngoài `required` được phép vắng mặt. null chỉ hợp lệ khi type/anyOf cho phép.
#   - x-change so với v0.4.0: new, changed, additive. Không ghi nghĩa là giữ như v0.4.0.
#   - x-review: S2 đến S20 là chi tiết chọn khi viết schema, đang mở để góp ý.
#   - x-deferred-columns là cột hoãn, x-moved-columns là cột chuyển sang lớp sau, x-removed-columns là cột bỏ.
#
# Cách kiểm tra một bản ghi: validate với {"$ref": "#/$defs/<tên bảng>"}.
# Bất biến một dòng được cài bằng if/then; bất biến nhiều bảng nằm ở x-invariants.

$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:turn-selector:data-contract:0.5.0
title: 'Data Contract v0.5.0: contract thu thập cho simulator'
description: 'Contract này đặc tả dữ liệu raw có thể thu thập: nghĩa, schema, nguồn và khả năng thu thập, khóa liên
  kết, đơn vị và thời gian, nullability. Không chốt thuật toán, feature, KPI, simulator, ngưỡng vận hành hay lịch
  triển khai. Tệp không ràng buộc gì ở gốc; mỗi bảng được validate qua $defs.'

x-contract:
  version: 0.5.0
  based_on: 0.4.0, commit e4d84f8, nhánh docs/w1-design-and-data-contract
  proposal_document: De_xuat_Data_Contract_v0.5.0_cho_Hiep.md
  companion_schema: dac_ta_sau_thu_thap_v0.5.0_de_xuat.schema.yaml
  status: simulator_ready
  production_status: pending_source_verification
  decision_document: docs/contracts/data-contract-v0.5.0.md
  breaking_changes: true
x-lifecycle:
  status: Chốt ranh giới thu thập cho simulator; downstream có version riêng
  steps:
  - step: Call logs, getStats, TURN metrics, probe giữa các TURN
    layer: File này
  - step: 'Feature tables: chặng, backbone, health, load'
    layer: Feature Engineering, ở file đi kèm
  - step: Ranking Engine, Selector API, client và ICE
    layer: Thuật toán; API ở file đi kèm
  - step: Decision Log
    layer: File này
  - step: Outcome Log
    layer: Đầu vào ở file này; view sau pipeline ở file đi kèm
  - step: Labeled Data, Dashboard, Evaluation
    layer: File đi kèm
x-conventions:
  time: UTC, ISO-8601 đến ms; Postgres timestamptz
  duration: Chỉ hợp lệ khi trừ trên cùng một đồng hồ đã biết; ưu tiên monotonic trên cùng endpoint và process. *_mono_ms
    đi với clock_session_id. Bản này chưa cần clock_domain theo từng dòng.
  partition: dt là ngày UTC của event_ts
  units: Thời gian và độ trễ ms; loss % 0–100; jitter ms; bitrate kbps; tỷ lệ 0–1
  unknown_vs_null: Enum dùng unknown khi chưa biết; null là không áp dụng hoặc chưa có số đo. Thiếu số đo không
    điền 0, không điền trung bình.
  key_columns: 'Cột trong khóa không null: dùng ''unknown'' hoặc ''-'''
  privacy: user_hash là HMAC-SHA256. Chỉ lưu IP máy chủ TURN. Không lưu IP người dùng, relatedAddress, relatedPort
    hay credential secret.
  requiredness: Mức nguồn không quyết định field bắt buộc hay nullable; mỗi field chốt theo từng trạng thái event.
  optional_vs_null: Field ngoài required có thể vắng mặt; chỉ field có type null hoặc anyOf null mới nhận null. Không dùng sentinel cho số đo.
  temporal_join: 'Tham chiếu turn_id vào dim_turn là lookup theo business key tại as_of: valid_from <= as_of < valid_to, null valid_to là vô hạn. 0 kết quả là unmapped, nhiều kết quả là ambiguous; không tự chọn bản mới nhất.'
  hundred_percent: 100% chỉ nghĩa là không chủ động lấy mẫu, không bảo đảm dữ liệu về đủ. Coverage thực tế nằm ở
    telemetry_coverage.
x-source-levels:
  A: Service hoặc app tự tạo được sau khi tích hợp
  B: 'Thu được có điều kiện: SDK, exporter, quyền truy cập, cấu hình'
  C: Cần phép đo hoặc hệ thống mới; không giả định trong profile nền
x-data-tiers:
  required: Không chủ động lấy mẫu trong phạm vi x-call-scope. Chỉ nghĩa là không lấy mẫu, không bảo đảm dữ liệu
    về đủ
  conditional: Có khi nguồn có năng lực; không có thì không có dòng, phần thiếu nằm ở telemetry_coverage
  sampled: Lấy mẫu theo §6.3 của v0.4.0
x-call-scopes:
  all_calls: Ghi cho mọi cuộc gọi
  relay_or_failed: Chỉ giữ khi cuộc gọi có lúc đi qua relay, hoặc khi cuộc gọi thất bại (x-rules.relay_scope)
  not_call: Không gắn với cuộc gọi
x-field-promotion-criteria:
  description: Một field chỉ được nâng từ dự kiến lên thu được khi có đủ các mục sau
  requires:
  - owner của nguồn
  - API hoặc log cụ thể
  - ví dụ event
  - đơn vị và đồng hồ
  - khóa join
  - hành vi khi thiếu
  - phạm vi nền tảng và phiên bản
x-observation-profiles:
  obs_base:
    description: Call logs, getStats và TURN metrics theo capability, Decision Log. Không có probe; health phải
      khai báo có hay không
    tables_expected:
    - call_session
    - selector_decision_request
    - selector_decision
    - endpoint_network_context
    - ice_event
    - call_stats_epoch
    - call_stats_5s
    - call_outcome
    - client_call_report
    - turn_health_1m
    tables_conditional:
    - client_applied_config
    - selector_decision_pair
    tables_absent:
    - turn_probe
    - turn_allocation
  obs_active:
    description: obs_base thêm probe giữa các TURN. Đây là dạng của vòng đời dữ liệu
    adds:
    - turn_probe
  obs_infra:
    description: Thêm log của TURN khi có nguồn
    adds:
    - turn_allocation
    - các cột lỗi allocation của turn_health_1m
x-rules:
  decision_objects: Tách cặp được cân nhắc (selector_decision_pair), hành động của Selector (selector_decision.entries)
    và cấu hình client đã áp dụng (client_applied_config). Không gộp thành chosen_rank.
  propensity: action_propensity là xác suất của cả hành động. Không nhân p_caller × p_callee khi hai bên được chọn
    chung; xác suất cặp ICE thực dùng không phải xác suất hành động. Nếu danh sách suy ra hoàn toàn tất định từ
    cặp dẫn đầu thì xác suất cặp đại diện được.
  list_count: Một mục là một TURN server (mentor xác nhận). Tối đa 8 server mỗi bên; UDP, TCP, TLS là thuộc tính transport của server, không chiếm thêm chỗ.
    Baseline trả đúng 8 khi đủ mục hợp lệ; thiếu thì insufficient_candidates, không nhân bản. Thuật toán cải tiến được trả ít hơn. Con số 8 theo mentor; cách chọn là config simulator.
  decision_without_selector: Chưa có Selector thì BE vẫn ghi selector_decision với decision_source = static_config,
    policy_version = static@1, selection_method = static, propensity_method = not_estimated, và không có dòng selector_decision_pair.
    decision_id luôn có.
  pair_rows: Ghi các cặp trong top-k và hành động đã chọn. Cặp thực tế khác các cặp đã ghi thì Labeled Data ghi
    là không có dự đoán, không suy ra. info_level khác full thì không ghi dòng selector_decision_pair; không đặt null trong khóa cặp.
  applied_config: Decision mới không tự đổi cấu hình client đang dùng. ice_attempt trỏ decision theo cấu hình đã
    áp dụng.
  list_duplicate: Duplicate định nghĩa theo normalized_config_key. Quy tắc policy cấm lặp server tách khỏi khóa
    dữ liệu.
  candidate_type_of_a_side: Loại candidate của mỗi đầu lấy từ local candidate của chính đầu đó. Remote candidate
    là bằng chứng phụ; remote prflx không tự nói lên loại thật.
  turn_identity_evidence: 'Raw chỉ ghi bằng chứng: local_turn_url, relayed_ip_local, relayed_ip_remote. Tra máy
    TURN do pipeline làm qua dim_turn_endpoint. Không dùng TURN do Selector yêu cầu làm bằng chứng.'
  rtt_samples: Cửa sổ RTT chỉ có mẫu mới khi roundTripTimeMeasurements tăng; không lặp RTT cũ.
  counters: Bộ đếm tích lũy đọc ở cuối epoch và tại mỗi lần đổi cặp. Hiệu giữa hai lần đọc liên tiếp cho số trung
    bình của một đường. Chỉ trừ khi cùng định danh stream. Bộ đếm của candidate-pair tính riêng theo cặp.
  network_epoch: Tăng khi client phát hiện đổi mạng. Nền tảng không phát hiện được thì giữ 0 và báo ở telemetry_coverage,
    không được hiểu là không đổi mạng.
  network_context: endpoint_network_context là snapshot BE ghi khi nhận context ban đầu hoặc tín hiệu đổi mạng; geo/ISP tra lúc nhận, network_type do client báo. Không lưu IP user; không dùng ctx tại decision để thay context epoch mới. observed_ts là đồng hồ BE, epoch_start_ts là đồng hồ client, không trừ chéo.
  turn_identity: Lookup dim_turn_endpoint theo IP máy chủ, role và thời điểm event trong khoảng hiệu lực; 0 dòng là unmapped, nhiều turn_id là ambiguous, thiếu bằng chứng là unknown. Không dùng ý định Selector để phá hòa.
  inventory_coverage: 'Country không có TURN trong inventory chỉ là no_turn_observed; unhealthy khác với không có inventory. Chỉ kết luận not_deployed khi phạm vi inventory đã xác nhận đầy đủ. Simulator khai báo inventory_scope trong run manifest/config.'
  relay_scope: Trước cuộc gọi không biết sẽ đi relay hay P2P, nên không lọc từ đầu. Bảng all_calls ghi cho mọi cuộc
    gọi. Bảng relay_or_failed chỉ giữ khi cuộc gọi có lúc đi qua relay, hoặc khi cuộc gọi thất bại. Thất bại nghĩa
    là đã bắt máy mà ICE hoặc media không đạt hoặc chưa rõ; cuộc gọi không bắt máy không tính. Không lọc theo đường
    được chọn là relay, vì cuộc gọi thất bại không có đường được chọn. Trong giả lập, mọi cuộc gọi chạy ice_transport_policy
    = relay.
  end_signal: BE ghi điều quan sát được, client báo lý do nếu có. Phân loại thành end_reason do pipeline làm, có
    version.
x-invariants:
- id: I1
  level: FAIL
  status: changed
  enforced_by: pipeline
  rule: Mọi event có call_id đều có call_session tương ứng.
- id: I2
  level: WARN
  status: changed
  enforced_by: pipeline
  rule: Mỗi call_session có đúng một call_outcome trong 72 giờ; thiếu thì là orphan nhưng vẫn ở trong cohort.
- id: I3
  level: FAIL
  status: changed
  enforced_by: pipeline
  rule: returned_list_size ≤ requested_max_list_size; rank liên tục 1..len; không trùng normalized_config_key trong
    một danh sách.
- id: I4
  level: WARN
  status: changed
  enforced_by: pipeline
  rule: TURN thực dùng nằm trong danh sách đã áp dụng cùng bên, trừ static_fallback. Danh tính chưa identified thì
    bỏ qua.
- id: I6
  level: FAIL
  status: changed
  enforced_by: schema
  rule: 'Trên raw: answered = false ⇒ end_signal ∈ {rejected, cancelled, not_answered_timeout, invite_undelivered,
    signaling_lost, unknown}. Bản theo end_reason nằm ở file đi kèm.'
- id: I10
  level: FAIL
  status: changed
  enforced_by: schema_and_pipeline
  rule: 0 ≤ value_ms ≤ 10000; 0 ≤ loss_pct ≤ 100; jitter ≥ 0; allocation_result = success ⇔ error_code = none; unknown
    thì error_code null. Range và allocation kiểm tra bằng schema; tổng histogram bằng số cửa sổ assessable kiểm tra ở pipeline.
- id: I11
  level: WARN
  status: unchanged
  enforced_by: pipeline
  rule: event_id duy nhất.
- id: I14
  level: FAIL
  status: unchanged
  enforced_by: pipeline
  rule: Selector không chặn lời mời gọi; lỗi hoặc timeout ⇒ decision_source = static_fallback.
- id: I17
  level: FAIL
  status: unchanged
  enforced_by: pipeline
  rule: Với endpoint derivation = sdk, stats_sampling_prob và stats_sampling_reason khớp §6.3 khi có đủ dữ liệu.
- id: I22
  level: FAIL
  status: unchanged
  enforced_by: pipeline
  rule: Endpoint derivation = pipeline có mọi cửa sổ đã gửi; mỗi endpoint chỉ một derivation.
- id: I25
  level: FAIL
  status: new
  enforced_by: pipeline
  review: S3
  rule: decision_id của selector_decision và selector_decision_pair phải có header selector_decision_request cùng call_id. parent_decision_id tham chiếu header cùng call_id và sớm hơn. phase, request_ts, policy_version, info_level của các list phải khớp header; field riêng từng bên được khác.
- id: I26
  level: FAIL
  status: new
  enforced_by: pipeline
  rule: Mỗi decision_id có bảng cặp không trống thì mỗi metric có đúng một is_lead=true; mọi metric phải có cùng cặp lead (hai TURN và hai transport). Cặp lead khớp hai entries rank 1 của danh sách Caller/Callee. info_level khác full hoặc static_config thì không có dòng pair.
- id: I29
  level: FAIL
  status: new
  enforced_by: pipeline
  rule: dim_turn_endpoint không có bản ghi trùng hay khoảng hiệu lực chồng lấn không có chủ đích của cùng một quan
    hệ.
- id: I30
  level: FAIL
  status: new
  enforced_by: pipeline
  rule: turn_probe có src_turn_id khác dst_turn_id.
- id: I31
  level: FAIL
  status: new
  enforced_by: pipeline
  rule: interval_low ≤ interval_high khi cả hai có giá trị.
x-concept-map:
  note: Ánh xạ khái niệm, không phải phép chuyển cơ học; không suy được thì để thiếu.
  mappings:
  - from: chosen_rank
    to: selector_decision_pair.is_lead
  - from: candidates[].propensity, joint_propensity
    to: action_propensity, propensity_method
  - from: k
    to: requested_max_list_size, returned_list_size, topk_pair_count
  - from: connected
    to: outcome_log.ice_connected, media_connected, outcome_status
  - from: end_reason trên call_outcome
    to: end_signal, client_end_reason; outcome_log.end_reason
  - from: answer_ts
    to: answer_received_at_be
  - from: success
    to: allocation_result
  - from: ice_attempt.transport
    to: ice_event.client_turn_transport; ice_attempt.client_turn_transport_*
  - from: checks_start_ts khi không có hook
    to: ice_event với ice_state = checking
  - from: ice_trigger = fallback
    to: bỏ
  - from: path_leg_measurement với mesh_probe
    to: turn_probe
  - from: turn_health_1m.health_status
    to: liveness_ok; health_snapshot.health_status
  - from: stats_status trên call_outcome
    to: client_call_report.stats_status
  not_mechanical:
  - connected = true cũ chỉ chứng minh ICE theo định nghĩa cũ, không tự chứng minh media_connected = true.
  - Propensity từng bên không tự chuyển thành xác suất của hành động nếu không biết cơ chế chọn; dữ liệu cũ có thể
    phải để action_propensity = null.
x-review-flags:
  note: Chi tiết chọn khi viết schema, đang mở để Hiệp góp ý.
  S2: 'Tên và cột của client_applied_config: config_source, is_fallback_config, applied_entries'
  S3: Giữ selector_decision theo từng bên, lặp field cấp quyết định, thêm I25
  S4: normalized_config_key, eligible_action_set, confidence_evidence
  S6: ice_event thêm dtls_state_change, restart_requested, event_mono_ms, clock_session_id
  S7: call_stats_5s thêm packets_received, rtt_measurements_delta
  S11: Enum observation_state và cột cùng tên trên turn_health_1m, turn_probe
  S12: decision_source = static_config và policy_version = static@1 khi chưa có Selector
  S13: Bảng turn_probe và các cột của nó
  S14: liveness_ok, liveness_method thay cho health_status trên raw
  S15: Bộ đếm tích lũy trên call_stats_epoch và trên dòng selected_pair_change của ice_event
  S16: end_signal, client_end_reason, và bảng client_call_report tách từ call_outcome
  S17: local_turn_url trên ice_event
  S18: server_session_id, credential_ref trên turn_allocation
  S19: Bỏ giá trị refined của decision_phase
  S20: sequence_no bắt buộc và nằm trong khóa của call_stats_epoch, vì checkpoint tạo nhiều dòng cùng epoch
x-out-of-scope:
- 'Pipeline làm sạch, Feature Engineering, Labeled Data, KPI và đánh giá, giả lập, API Selector: xem file đi kèm'
- Mô hình ICE trong simulator, nhiễu, tham số lab
- Mô hình ghép chặng, gate, ngưỡng
- Detector stall, tiêu chí xác nhận, chu kỳ đo
- Margin, power, benchmark, luật thắng thua, sensitivity
- Phân công, tiến độ

$defs:
  # ---------- Kiểu chung và enum ----------
  e_confidence_level: {type: string, enum: [high, medium, low]}
  rtt_hist: {type: object, propertyNames: {enum: [lt100, '100_200', '200_300', '300_400', ge400]}, additionalProperties: {type: integer, minimum: 0}, description: 'Số cửa sổ theo bucket; {} khi không có cửa sổ đánh giá được'}
  loss_hist: {type: object, propertyNames: {enum: [lt1, '1_3', '3_5', ge5]}, additionalProperties: {type: integer, minimum: 0}, description: 'Số cửa sổ theo bucket; {} khi không có cửa sổ đánh giá được'}
  jitter_hist: {type: object, propertyNames: {enum: [lt10, '10_30', '30_50', ge50]}, additionalProperties: {type: integer, minimum: 0}, description: 'Số cửa sổ theo bucket; {} khi không có cửa sổ đánh giá được'}
  e_data_source: {type: string, enum: [synthetic, lab_zenodo, lab_controlled, public_reference, production], x-contract-ref: §1.1, description: lab_controlled là giá trị bổ sung cho lab tự làm, x-change: changed}
  e_producer: {type: string, enum: [client_sdk, signaling, selector, turn_server, probe_agent, simulator], x-contract-ref: §1.1}
  e_side: {type: string, enum: [caller, callee], x-contract-ref: §2}
  e_network_type: {type: string, enum: [wifi, 4g, 5g, ethernet, unknown], x-contract-ref: §2}
  e_media_kind: {type: string, enum: [audio, video], x-contract-ref: §2}
  e_platform: {type: string, enum: [ios, android, web, desktop, unknown], x-contract-ref: §2}
  e_call_type: {type: string, enum: [one_to_one, group, unknown], x-contract-ref: §2}
  e_stats_derivation: {type: string, enum: [sdk, pipeline], x-contract-ref: §2}
  e_info_level: {type: string, enum: [full, caller_only, country_only, none], x-contract-ref: §2}
  e_decision_phase: {type: string, enum: [initial, context_update, restart], x-contract-ref: §2, description: context_update là request mới có parent_decision_id khi có thêm Callee context; không đổi cấu hình nếu client chưa áp dụng, x-change: changed, x-review: S19}
  e_decision_source: {type: string, enum: [api, static_config, static_fallback, cache], x-contract-ref: §2, description: 'static_config: chưa có Selector, BE cấp danh sách tĩnh. static_fallback: có Selector nhưng lỗi hoặc timeout', x-change: changed, x-review: S12}
  e_connection_mode: {type: string, enum: [post_answer, pre_connect], x-contract-ref: §2}
