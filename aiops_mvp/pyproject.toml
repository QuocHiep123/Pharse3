[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calldiag"
version = "0.1.0"
description = "Deterministic WebRTC call telemetry and incident diagnosis MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "plotly>=5.20",
    "streamlit>=1.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.0"]

[project.scripts]
calldiag = "calldiag.cli:main"

[tool.setuptools.packages.find]
include = ["calldiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
